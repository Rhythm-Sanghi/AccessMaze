name: verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.accessmaze/browsers
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
          cache: npm
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.9.2"
      - run: npm ci
      - run: npm ci --prefix benchmarks/pa11y
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
      - run: uv sync --project engine --locked --python 3.13
      - run: uv run --project engine playwright install --with-deps chromium
      - name: Permit Windows Chromium sandbox to read the test browser
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $browserCache = Join-Path $env:GITHUB_WORKSPACE '.accessmaze/browsers'
          if (-not (Test-Path -LiteralPath $browserCache -PathType Container)) {
            throw 'Downloaded test browser cache is missing'
          }
          icacls $browserCache /grant '*S-1-15-2-1:(OI)(CI)(RX)' /T /Q
          if ($LASTEXITCODE -ne 0) { throw 'Chromium sandbox read permission failed' }
      - run: npm run check
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: uv run --project engine ruff check engine scripts
      - run: uv run --project engine ruff format --check engine scripts
      - name: Verify repeated visible recorder lifecycle and cancellation
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          for ($attempt = 1; $attempt -le 5; $attempt++) {
            uv run --project engine pytest engine/tests/test_recorder.py::test_headed_recorder_worker_lifecycle_on_windows engine/tests/test_recorder.py::test_recorder_stop_cancels_slow_initial_navigation -q
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - run: uv run --project engine pytest engine/tests -q
        env:
          ACCESSMAZE_CORPUS_OUTPUT: ${{ github.workspace }}/dist/compatibility-corpus
          ACCESSMAZE_CORPUS_PA11Y: "1"
          ACCESSMAZE_CORPUS_PA11Y_NO_SANDBOX: ${{ runner.os == 'Linux' && '1' || '0' }}
      - name: Verify recorder shutdown after the full browser workload
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          for ($attempt = 1; $attempt -le 30; $attempt++) {
            Write-Output "Post-suite recorder lifecycle pair $attempt of 30"
            uv run --project engine pytest engine/tests/test_recorder.py::test_headed_recorder_worker_lifecycle_on_windows engine/tests/test_recorder.py::test_recorder_stop_cancels_slow_initial_navigation -q -s --junitxml="dist/recorder-stability/after-$attempt.xml"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Inspect remaining Windows recorder processes and profile permissions
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist/recorder-stability -Force | Out-Null
          $profiles = @(Get-ChildItem -LiteralPath $env:TEMP -Directory -Filter 'playwright_chromiumdev_profile-*')
          $reports = @(foreach ($profile in ($profiles | Sort-Object CreationTime -Descending | Select-Object -First 20)) {
            $cache = Join-Path $profile.FullName 'Default/Shared Dictionary/cache'
            $entry = [ordered]@{ profile = $profile.Name; cache_exists = Test-Path -LiteralPath $cache }
            if ($entry.cache_exists) {
              try {
                $entry.cache_acl = (Get-Acl -LiteralPath $cache -ErrorAction Stop).AccessToString
                $null = Get-ChildItem -LiteralPath $cache -Force -ErrorAction Stop | Select-Object -First 1
                $entry.cache_readable = $true
              } catch {
                $entry.cache_readable = $false
                $entry.error_category = $_.CategoryInfo.Category.ToString()
                $entry.error_type = $_.Exception.GetType().FullName
              }
            }
            [pscustomobject]$entry
          })
          $processes = @(Get-CimInstance Win32_Process -Filter "Name='chrome.exe' OR Name='node.exe'" | Select-Object ProcessId, ParentProcessId, CreationDate)
          [ordered]@{ scope = 'Read-only process/profile metadata; no file contents or permission changes'; profile_count = $profiles.Count; inspection_limit = 20; profiles = $reports; processes = $processes } | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath dist/recorder-stability/profile-diagnostics.json -Encoding utf8
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: compatibility-corpus-${{ matrix.os }}-${{ github.sha }}
          path: |
            dist/compatibility-corpus/*.json
            dist/compatibility-corpus/*.html
            dist/compatibility-corpus/*.stdout
            dist/compatibility-corpus/*.stderr
            dist/recorder-stability/*.xml
            dist/recorder-stability/*.json
          if-no-files-found: warn
          retention-days: 14
      - run: uv run --project engine python scripts/contracts.py --check
      - run: npm audit --audit-level=moderate
      - run: npm audit --prefix benchmarks/pa11y --audit-level=moderate
      - run: uv run --project engine pip-audit
      - if: runner.os == 'Windows'
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - if: runner.os == 'Windows'
        run: cargo check --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
      - if: runner.os == 'Windows'
        run: cargo fmt --check --manifest-path apps/desktop/src-tauri/Cargo.toml
      - if: runner.os == 'Windows'
        run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
      - if: runner.os == 'Windows'
        run: cargo install cargo-audit --version 0.22.2 --locked
      - if: runner.os == 'Windows'
        working-directory: apps/desktop/src-tauri
        run: cargo audit
  windows-preview:
    needs: checks
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
          cache: npm
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.9.2"
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - run: npm ci
      - run: uv sync --project engine --locked --python 3.13
      - run: uv run --project engine python scripts/package_windows.py --name AccessMaze-ci-preview
      - run: powershell -NoProfile -File scripts/Test-AccessMazePortable.ps1 -Package dist/AccessMaze-ci-preview -Report dist/portable-verification.json
      - run: uv run --project engine python scripts/portable_smoke.py --package AccessMaze-ci-preview --complex --report dist/complex-verification.json
      - run: uv run --project engine python scripts/archive_preview.py --package dist/AccessMaze-ci-preview --archive dist/AccessMaze-ci-preview.zip --report dist/archive-verification.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-readiness-preview-${{ github.sha }}
          path: |
            dist/AccessMaze-ci-preview.zip
            dist/*-verification.json
          if-no-files-found: error
          retention-days: 14
