[project]
name = "accessmaze-engine"
version = "0.1.0"
description = "Local, evidence-backed browser journey analysis"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "playwright==1.63.0",
    "pydantic==2.14.0",
    "networkx==3.7",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.13.1",
    "pyinstaller==6.16.0",
    "psutil==7.1.0",
    "pip-audit==2.10.1",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["accessmaze"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["browser: launches real Chromium against local fixtures"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
